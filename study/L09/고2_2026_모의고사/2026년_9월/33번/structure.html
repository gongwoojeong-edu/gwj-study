<title>Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process essential to consciousness. At a psychological level, it supports us to both face into our own and others' vulnerability, transience and mortality, and to repair life energy after significant loss. Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life. Psychotherapist Fran Weller describes grief work is "an act of devotion, rooted in love and compassion" that requires "an ongoing practice of deepening, attending and listening." When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains. In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them. Grief can make us both very sad and very motivated to act.</title>

  var colors=STEP_BADGES[i]||STEP_BADGES[0];

  document.getElementById("d-title").textContent=n.label||"";
  document.getElementById("d-en").innerHTML=n.english||"";
  document.getElementById("d-ko").innerHTML=n.literal||n.korean||"";
  document.getElementById("d-pt").innerHTML=n.point||"";
  var wrap=document.getElementById("detail-wrap");
  wrap.classList.add("visible");
  setTimeout(function(){wrap.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
};
window.closeDetail=function(){
  currentDetail=-1;
  document.getElementById("detail-wrap").classList.remove("visible");
