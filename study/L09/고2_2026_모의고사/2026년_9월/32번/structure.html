<title>Of the cognitive motivations, the most fundamental one encourages people to understand their environment to predict what is going to happen in case of uncertainties. Most important, people prefer to develop meanings that are shared with other people. For example, if in a given year more people accept offers of admission than a college expects, quite a few students end up living in dorm lounges or campus hotels. It is easy to understand why living in the lounge is problematic (no closet, for one thing). But what is wrong with a room at campus hotels? After all, students in a hotel get private bathrooms, their own TV, and larger rooms. In fact, living in those hotels is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche. The uncertainty itself is the problem. People lack a shared social understanding, normally developed from membership in a stable group.</title>

.point-box { background: #fef9f0; border: 1px solid #e8c87a; border-left: 3.5px solid #e8a020; border-radius: 0 8px 8px 0; padding: 8px 13px; font-size: 12.5px; color: #5a3500; line-height: 1.6; }
.close-btn { display: block; width: 100%; margin-top: 12px; padding: 8px; background: none; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; color: #aaa; cursor: pointer; font-family: inherit; }
.close-btn:hover { background: #f5f5f5; color: #666; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #666; }

<script>
(function(){
var STEP_BADGES=[{bg:"#F1EFE8",color:"#555",badge:"단계 ①"},{bg:"#FCEBEB",color:"#791F1F",badge:"단계 ②"},{bg:"#FCEBEB",color:"#791F1F",badge:"단계 ③"},{bg:"#E1F5EE",color:"#085041",badge:"단계 ④ — ★ 전환점"},{bg:"#E6F1FB",color:"#0C447C",badge:"단계 ⑤"},{bg:"#EEEDFE",color:"#3C3489",badge:"단계 ⑥ — ★ 결론"}];
var currentDetail=-1;
function readExportData(){return JSON.parse(document.getElementById("gwj-structure-data").textContent);}
window.showDetail=function(i){
  var nodes=readExportData().nodes;
  var n=nodes[i];
  if(!n)return;
  if(currentDetail===i){closeDetail();return;}
  currentDetail=i;
  var colors=STEP_BADGES[i]||STEP_BADGES[0];
  var badge=document.getElementById("d-badge");
  badge.textContent=colors.badge+" — "+(n.label||"");
  badge.style.background=colors.bg;
  badge.style.color=colors.color;
  document.getElementById("d-title").textContent=n.label||"";
  document.getElementById("d-en").innerHTML=n.english||"";
  document.getElementById("d-ko").innerHTML=n.literal||n.korean||"";
  document.getElementById("d-pt").innerHTML=n.point||"";
  var wrap=document.getElementById("detail-wrap");
  wrap.classList.add("visible");
  setTimeout(function(){wrap.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
};
window.closeDetail=function(){
  currentDetail=-1;
  document.getElementById("detail-wrap").classList.remove("visible");
};
})();
</script>
