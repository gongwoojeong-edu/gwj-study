<title>Progressive educators and librarians are developing curricula to teach what we might call attention literacy. This means helping students recognize, for example, how the architecture of a social media feed or a news site is deliberately designed to distract or provoke them. Classes in media literacy traditionally cover how to evaluate the credibility of sources — now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one's own patterns of distraction. A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation. Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more critical users rather than passive consumers.</title>

  document.getElementById("d-pt").innerHTML=n.point||"";
  var wrap=document.getElementById("detail-wrap");
  wrap.classList.add("visible");
  setTimeout(function(){wrap.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
};
window.closeDetail=function(){
  currentDetail=-1;
