<title>Our adult brains retain a preference for perpetuating good, fair behavior. Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future. In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they'd made from the study — almost twice as much as those who had been instructed to recall previous bad deeds. In addition, subjects who'd taken pains to describe not only how they'd been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good for its own sake. According to the study, the motivation to do good deeds was more evident in those who recalled their past virtues and those who focused purely on their good deeds than those who recalled their previous bad deeds and those who seemed highly conscious of the appearances of their deeds.</title>

<script>

var currentDetail=-1;
function readExportData(){return JSON.parse(document.getElementById("gwj-structure-data").textContent);}
window.showDetail=function(i){
  var nodes=readExportData().nodes;
  var n=nodes[i];
  if(!n)return;
  if(currentDetail===i){closeDetail();return;}
  currentDetail=i;
  var colors=STEP_BADGES[i]||STEP_BADGES[0];
  var badge=document.getElementById("d-badge");
  badge.textContent=colors.badge+" — "+(n.label||"");
  badge.style.background=colors.bg;
  badge.style.color=colors.color;
  document.getElementById("d-title").textContent=n.label||"";
  document.getElementById("d-en").innerHTML=n.english||"";
  document.getElementById("d-ko").innerHTML=n.literal||n.korean||"";
  document.getElementById("d-pt").innerHTML=n.point||"";
  var wrap=document.getElementById("detail-wrap");
  wrap.classList.add("visible");
  setTimeout(function(){wrap.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
};
window.closeDetail=function(){
  currentDetail=-1;
  document.getElementById("detail-wrap").classList.remove("visible");
};
})();
