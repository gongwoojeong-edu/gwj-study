<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A remarkable characteristic of the visual system is that it has the ability of adapting itself.</title>
<style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #333; line-height: 1.55; margin: 0; background: #f5f5f0; }
.structure-view { max-width: 780px; margin: 20px auto; padding: 20px; }
.structure-header { text-align: center; margin-bottom: 20px; }
.structure-header .badge { display: inline-block; background: #791F1F; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 12px; border-radius: 20px; margin-bottom: 8px; }
.structure-header h1 { font-size: 22px; font-weight: 700; color: #333; margin-bottom: 4px; }
.structure-header p { font-size: 12px; color: #888; }
.diagram-wrap { background: #fff; border-radius: 16px; border: 1px solid #e0e0d8; padding: 28px 24px 24px; margin-bottom: 16px; }
.diagram-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.node-g { cursor: pointer; transition: opacity 0.15s; }
.node-g:hover { opacity: 0.82; }
.detail-wrap { display: none; animation: slideIn 0.25s ease; }
.detail-wrap.visible { display: block; }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.detail-card { background: #fff; border-radius: 14px; border: 1.5px solid #dde2ef; overflow: hidden; }
.detail-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #eee; }
.detail-step-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.detail-title { font-size: 16px; font-weight: 700; color: #333; }
.detail-body { padding: 14px 18px; }
.label-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.label-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: #888; background: #f0f0ec; padding: 2px 8px; border-radius: 4px; }
.en-box { border-left: 3.5px solid #ccc; border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 13.5px; line-height: 1.75; color: #333; margin-bottom: 10px; background: #f8f7f3; }
.hl-navy,.hl-blue { color: #791F1F; font-weight: 700; }
.hl-teal { color: #0a5040; font-weight: 700; }
.hl-amber { color: #7a4500; font-weight: 700; }
.hl-red { color: #9a2010; font-weight: 700; }
.hl-purple { color: #4a2d88; font-weight: 700; }
.ko-box { background: #fdf5f5; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #333; line-height: 1.7; margin-bottom: 10px; }
.point-box { background: #fef9f0; border: 1px solid #e8c87a; border-left: 3.5px solid #e8a020; border-radius: 0 8px 8px 0; padding: 8px 13px; font-size: 12.5px; color: #5a3500; line-height: 1.6; }
.close-btn { display: block; width: 100%; margin-top: 12px; padding: 8px; background: none; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; color: #aaa; cursor: pointer; font-family: inherit; }
.close-btn:hover { background: #f5f5f5; color: #666; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #666; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }</style>
</head>
<body>

    <div class="structure-view">

        <div class="badge">GWJ EDU 공우정바른학원</div>

          </g>
          <rect x="14" y="308" width="652" height="44" rx="8" fill="#fafafa" stroke="#e0e0d8" stroke-width="0.5"/>
          <text x="24" y="326" font-size="11" font-weight="700" fill="#A32D2D">심경 변화</text>
          <text x="110" y="326" font-size="11" fill="#A32D2D">실험 시작(중립)</text>
          <text x="110" y="342" font-size="10" fill="#bbb">(made this clear in an impressive self-experiment)</text>
          <line x1="220" y1="330" x2="380" y2="330" stroke="#ccc" stroke-width="1" marker-end="url(#arr)"/>
          <text x="296" y="322" text-anchor="middle" font-size="10" fill="#888">어려움 → 적응 → 재혼란</text>
          <text x="400" y="326" font-size="11" font-weight="700" fill="#3C3489">완전 회복(긍정)</text>
          <text x="400" y="342" font-size="10" fill="#bbb">(everything returned to normal after one day)</text>
          <text x="600" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="#0a9a60">★ 빈출 유형</text>
        </svg>
      </div>
      <div class="detail-wrap" id="detail-wrap">
        <div class="detail-card">
          <div class="detail-head">
            <span class="detail-step-badge" id="d-badge"></span>
            <span class="detail-title" id="d-title"></span>
          </div>
          <div class="detail-body">
            <div class="label-row"><span class="label-tag">원문</span></div>
            <div class="en-box" id="d-en"></div>
            <div class="label-row"><span class="label-tag">직독·의역</span></div>
            <div class="ko-box" id="d-ko"></div>
            <div class="label-row"><span class="label-tag">시험 포인트</span></div>
            <div class="point-box" id="d-pt"></div>
            <button class="close-btn" onclick="closeDetail()">▲ 닫기</button>
          </div>
        </div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#c0bdb6;"></div><span>배경</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#A32D2D;"></div><span>갈등·긴장</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#0F6E56;"></div><span>★ 전환점</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#185FA5;"></div><span>전개</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#534AB7;"></div><span>★ 결론</span></div>
      </div>
    </div>

<script>
(function(){
var STEP_BADGES=[{bg:"#F1EFE8",color:"#555",badge:"단계 ①"},{bg:"#FCEBEB",color:"#791F1F",badge:"단계 ②"},{bg:"#FCEBEB",color:"#791F1F",badge:"단계 ③"},{bg:"#E1F5EE",color:"#085041",badge:"단계 ④ — ★ 전환점"},{bg:"#E6F1FB",color:"#0C447C",badge:"단계 ⑤"},{bg:"#EEEDFE",color:"#3C3489",badge:"단계 ⑥ — ★ 결론"}];
var currentDetail=-1;
function readExportData(){return JSON.parse(document.getElementById("gwj-structure-data").textContent);}
window.showDetail=function(i){
  var nodes=readExportData().nodes;
  var n=nodes[i];
  if(!n)return;
  if(currentDetail===i){closeDetail();return;}
  currentDetail=i;
  var colors=STEP_BADGES[i]||STEP_BADGES[0];
  var badge=document.getElementById("d-badge");
  badge.textContent=colors.badge+" — "+(n.label||"");
  badge.style.background=colors.bg;
  badge.style.color=colors.color;
  document.getElementById("d-title").textContent=n.label||"";
  document.getElementById("d-en").innerHTML=n.english||"";
  document.getElementById("d-ko").innerHTML=n.literal||n.korean||"";
  document.getElementById("d-pt").innerHTML=n.point||"";
  var wrap=document.getElementById("detail-wrap");
  wrap.classList.add("visible");
  setTimeout(function(){wrap.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
};
window.closeDetail=function(){
  currentDetail=-1;
  document.getElementById("detail-wrap").classList.remove("visible");
};
})();
</script>
</body>
</html>
